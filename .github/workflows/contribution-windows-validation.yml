name: Issue fixes Windows validation
on:
  push:
    branches: [test/windows-dashboard-respawn-ci]
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Prepare locked test environment
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
      - name: Run migration and native process regression tests
        shell: bash
        run: |
          HERMES_TEST_FILE_RETRIES=0 scripts/run_tests.sh \
            tests/hermes_cli/test_dashboard_respawn_windows_live.py \
            tests/hermes_cli/test_update_stale_dashboard.py \
            tests/hermes_cli/test_stale_pid_guard.py \
            tests/hermes_cli/test_update_serve_generation_recovery.py \
            tests/skills/test_openclaw_migration.py \
            tests/skills/test_openclaw_migration_capabilities.py \
            tests/skills/test_openclaw_migration_hardening.py \
            tests/hermes_cli/test_setup_openclaw_migration.py -q
